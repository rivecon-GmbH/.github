name: Claude-Review (wiederverwendbar)

# Automatisches Review durch Claude bei Pull Requests und Antworten auf @claude.
# Claude schreibt nur Kommentare. Es committet, pusht und merged nichts
# (der Aufrufer vergibt nur contents: read).
#
# Der aufrufende Workflow muss die Trigger und die Berechtigungen liefern, siehe
# workflow-templates/rivecon-claude-review.yml.

on:
  workflow_call:
    inputs:
      model:
        description: Optionales Claude-Modell (leer = Standard der Action)
        type: string
        default: ""
    secrets:
      anthropic_api_key:
        description: Anthropic-API-Key (Organisations- oder Repo-Secret ANTHROPIC_API_KEY)
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    # Draft-PRs werden uebersprungen; bei "ready_for_review" laeuft das Review.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          track_progress: true
          claude_args: >-
            ${{ inputs.model != '' && format('--model {0} ', inputs.model) || '' }}--allowedTools
            "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMMER: ${{ github.event.pull_request.number }}

            Du pruefst einen Pull Request in einem Odoo-Projekt der rivecon GmbH (Odoo 19,
            teils 20, Deployment auf Odoo.sh). Antworte ausschliesslich auf Deutsch.

            Regeln:
            - Aendere keine Dateien, committe nichts, merge nichts. Du schreibst nur Kommentare.
            - Lies die Aenderungen mit `gh pr diff` und bei Bedarf die betroffenen Dateien.
            - Gibt es eine CLAUDE.md im Repo, beachte sie.
            - Kommentiere nur, was wirklich auffaellt. Kein Lob-Fuellstoff, keine Stilfragen,
              die Ruff oder pylint-odoo ohnehin melden.

            Schwerpunkte:
            1. Sicherheit: rohes SQL statt ORM (SQL-Injection), unnoetiges sudo(), fehlende
               Zugriffsrechte (ir.model.access, Record Rules, Feldgruppen), Controller mit auth='public'
               oder csrf=False, safe_eval, Secrets im Code, unescaptes HTML (Markup).
            2. Odoo-Best-Practices fuer Version 19/20: ORM statt SQL, korrekte Manifest-Abhaengigkeiten
               (depends vollstaendig, keine ueberfluessigen), Performance bei Schleifen ueber
               Recordsets (search/create/write in Schleifen, N+1, fehlendes mapped/filtered,
               read_group/_read_group statt Schleifen), veraltete Odoo-API (z. B. attrs,
               _sql_constraints, name_get, onchange-Muster, Tree- statt List-View).
            3. Migrationsrisiken bei Datenmodellaenderungen: umbenannte/entfernte Felder oder Modelle,
               neue Pflichtfelder ohne Default, geaenderte Feldtypen, fehlende Migrationsskripte,
               Versionsnummer im Manifest nicht erhoeht.
            4. Fehlende oder offensichtlich unpassende Tests bei Geschaeftslogik.

            Ausgabe: Spezifische Probleme als Inline-Kommentare an der Codezeile
            (mcp__github_inline_comment__create_inline_comment), danach ein knapper Gesamtkommentar
            per `gh pr comment` mit Zusammenfassung und Risikoeinschaetzung
            (kritisch / wichtig / Hinweis). Gibt es nichts Relevantes, sage das in einem Satz.

  assist:
    # Antworten auf @claude in Kommentaren zu Pull Requests.
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null
        && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          claude_args: >-
            ${{ inputs.model != '' && format('--model {0} ', inputs.model) || '' }}--append-system-prompt
            "Antworte auf Deutsch. Aendere keine Dateien, committe nichts, pushe nichts. Antworte nur per Kommentar."
