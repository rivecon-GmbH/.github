name: Odoo Code-Scan (wiederverwendbar)

# Rein informativer Scan: Bandit, pylint-odoo, Ruff, gitleaks.
# Jeder Pruefschritt laeuft mit continue-on-error und blockiert nichts.
# Aufruf aus einem Repo:
#   jobs:
#     scan:
#       uses: rivecon-GmbH/.github/.github/workflows/odoo-code-scan.yml@main
#       with:
#         odoo-version: "19.0"

on:
  workflow_call:
    inputs:
      python-version:
        description: Python-Version fuer die Pruefwerkzeuge
        type: string
        default: "3.12"
      odoo-version:
        description: Odoo-Version fuer pylint-odoo (z. B. 19.0)
        type: string
        default: "19.0"
      exclude-paths:
        description: Kommagetrennte Pfade, die Bandit, Ruff und pylint-odoo auslassen (z. B. "integration,vendor")
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: rivecon-code-scan-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Werkzeuge installieren
        run: |
          python -m pip install --upgrade pip
          pip install bandit pylint-odoo ruff
          : > "$RUNNER_TEMP/results.tsv"

      - name: Bandit (Sicherheit)
        id: bandit
        continue-on-error: true
        env:
          EXCLUDES: ${{ inputs.exclude-paths }}
        run: |
          set +e
          X="./.git,./node_modules"
          for p in ${EXCLUDES//,/ }; do X="$X,./$p"; done
          bandit -r . -ll -x "$X" -f json -o "$RUNNER_TEMP/bandit.json" -q
          if [ -s "$RUNNER_TEMP/bandit.json" ]; then
            n=$(python -c "import json,sys;print(len(json.load(open(sys.argv[1]))['results']))" "$RUNNER_TEMP/bandit.json")
          else
            n="Fehler beim Lauf"
          fi
          printf 'Bandit (Sicherheit)\t%s\n' "$n" >> "$RUNNER_TEMP/results.tsv"
          bandit -r . -ll -x "$X" -q || true

      - name: pylint-odoo
        id: pylint
        continue-on-error: true
        env:
          EXCLUDES: ${{ inputs.exclude-paths }}
          ODOO_VERSION: ${{ inputs.odoo-version }}
        run: |
          set +e
          git ls-files -z -- '*.py' > "$RUNNER_TEMP/py.list"
          if [ -n "$EXCLUDES" ]; then
            python - "$RUNNER_TEMP/py.list" "$EXCLUDES" <<'PY'
          import sys
          path, ex = sys.argv[1], [e.strip().strip('/') for e in sys.argv[2].split(',') if e.strip()]
          files = [f for f in open(path, 'rb').read().decode().split('\0') if f]
          files = [f for f in files if not any(f == e or f.startswith(e + '/') for e in ex)]
          open(path, 'wb').write(('\0'.join(files) + ('\0' if files else '')).encode())
          PY
          fi
          if [ ! -s "$RUNNER_TEMP/py.list" ]; then
            printf 'pylint-odoo\tkeine Python-Dateien\n' >> "$RUNNER_TEMP/results.tsv"
            exit 0
          fi
          xargs -0 pylint --load-plugins=pylint_odoo -d all -e odoolint \
            --valid-odoo-versions="$ODOO_VERSION" --jobs=0 \
            < "$RUNNER_TEMP/py.list" > "$RUNNER_TEMP/pylint.txt" 2>&1
          n=$(grep -cE ':[0-9]+:[0-9]+: [A-Z][0-9]{4}:' "$RUNNER_TEMP/pylint.txt")
          printf 'pylint-odoo\t%s\n' "$n" >> "$RUNNER_TEMP/results.tsv"
          cat "$RUNNER_TEMP/pylint.txt"

      - name: Ruff
        id: ruff
        continue-on-error: true
        env:
          EXCLUDES: ${{ inputs.exclude-paths }}
        run: |
          set +e
          ARGS=()
          for p in ${EXCLUDES//,/ }; do ARGS+=(--extend-exclude "$p"); done
          ruff check . "${ARGS[@]}" --output-format=github > "$RUNNER_TEMP/ruff.txt"
          code=$?
          cat "$RUNNER_TEMP/ruff.txt"
          if [ "$code" -gt 1 ]; then
            n="Fehler beim Lauf"
          else
            n=$(grep -cE '^::(error|warning|notice)' "$RUNNER_TEMP/ruff.txt")
          fi
          printf 'Ruff\t%s\n' "$n" >> "$RUNNER_TEMP/results.tsv"

      - name: gitleaks (Secrets)
        id: gitleaks
        continue-on-error: true
        run: |
          set +e
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tar_name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tar_name" "$base/$tar_name" \
            && curl -sSfL -o "$RUNNER_TEMP/gitleaks_checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            && (cd "$RUNNER_TEMP" && grep " $tar_name\$" gitleaks_checksums.txt | sha256sum -c -) \
            && tar -xzf "$RUNNER_TEMP/$tar_name" -C "$RUNNER_TEMP" gitleaks
          if [ ! -x "$RUNNER_TEMP/gitleaks" ]; then
            printf 'gitleaks (Secrets)\tFehler beim Lauf (Download)\n' >> "$RUNNER_TEMP/results.tsv"
            exit 0
          fi
          # --redact: Fundstellen nie im Klartext ins Log schreiben
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" --exit-code 0
          code=$?
          if [ "$code" -ne 0 ] || [ ! -f "$RUNNER_TEMP/gitleaks.json" ]; then
            n="Fehler beim Lauf"
          else
            n=$(python -c "import json,sys;print(len(json.load(open(sys.argv[1]))))" "$RUNNER_TEMP/gitleaks.json")
            if [ "$n" -gt 0 ]; then
              python - "$RUNNER_TEMP/gitleaks.json" <<'PY'
          import json, sys
          for f in json.load(open(sys.argv[1])):
              print(f"::warning file={f.get('File')},line={f.get('StartLine')}::gitleaks: {f.get('RuleID')} (Commit {str(f.get('Commit'))[:8]})")
          PY
            fi
          fi
          printf 'gitleaks (Secrets)\t%s\n' "$n" >> "$RUNNER_TEMP/results.tsv"

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "## Code-Scan (rein informativ)"
            echo
            echo "| Werkzeug | Funde |"
            echo "|---|---|"
            while IFS=$'\t' read -r tool n; do
              [ -z "$tool" ] && continue
              [ "$n" = "0" ] && n="keine Funde"
              echo "| $tool | $n |"
            done < "$RUNNER_TEMP/results.tsv"
            echo
            echo "Die Pruefungen blockieren weder Builds noch Merges."
          } >> "$GITHUB_STEP_SUMMARY"
